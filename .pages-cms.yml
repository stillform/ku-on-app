site:
  base_url: "https://xanadauchaos.github.io/redesigned-octo-eureka/"
  branch: "main"

media:
  folder: "images"
  type: "images"

content:
  - name: "about"
    label: "About Page"
    type: "file"
    path: "content/about/_index.md"
    format: "frontmatter"
    fields:
      - name: "title"
        label: "Page Title"
        type: "string"
      - name: "description"
        label: "Description"
        type: "text"
      - name: "body"
        label: "Page Content"
        type: "rich-text"

  - name: "breathe"
    label: "Breathe Exercise"
    type: "file"
    path: "content/breathe/_index.md"
    format: "frontmatter"
    fields:
      - name: "title"
        label: "Title"
        type: "string"
      - name: "description"
        label: "Description"
        type: "text"

  - name: "ground"
    label: "Grounding Exercise"
    type: "file"
    path: "content/ground/_index.md"
    format: "frontmatter"
    fields:
      - name: "title"
        label: "Title"
        type: "string"
      - name: "description"
        label: "Description"
        type: "text"

  - name: "settle"
    label: "Settle Body Scan"
    type: "file"
    path: "content/settle/_index.md"
    format: "frontmatter"
    fields:
      - name: "title"
        label: "Title"
        type: "string"
      - name: "description"
        label: "Description"
        type: "text"
